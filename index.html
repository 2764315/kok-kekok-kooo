<!DOCTYPE html>
<html lang="ja">

<head>
	<meta name="robots" content="noindex">
	<meta charset="UTF-8">
	<title>発表配信ツール コッケコッコー!!!</title>
	<script src="https://unpkg.com/lucide@0.292.0/dist/umd/lucide.min.js"
		integrity="sha384-E1pALgGQd5jo9+CjsxlKe6NWRynty/TMVcFeBANdn+V5RTR5v+POlW5Ys+JJrUa8"
		crossorigin="anonymous"></script>
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" href="favicon.ico">
</head>

<body>
	<!-- アクティビティバー -->
	<div id="activity-bar">
		<div style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
			<button id="nav-csv-btn" class="activity-icon active" title="フォルダ生成">
				<i data-lucide="folder-plus"></i>
				<span>準備</span>
			</button>
			<button id="nav-preview-btn" class="activity-icon" title="データプレビュー">
				<i data-lucide="monitor-play"></i>
				<span>配信</span>
			</button>
		</div>
		<div style="margin-top: auto; margin-bottom: 15px; width: 100%; display: flex; justify-content: center;">
			<button id="global-settings-btn" class="activity-icon" title="初期設定">
				<i data-lucide="settings"></i>
				<span>設定</span>
			</button>
		</div>
	</div>

	<!-- iframeコンテナ -->
	<div id="content-area">
		<iframe id="frame-csv" src="folder-generation.html" style="display: block;"></iframe>
		<iframe id="frame-preview" src="data-preview.html" style="display: none;"></iframe>
	</div>

	<!-- 共通設定モーダル -->
	<div id="global-settings-modal-overlay">
		<button id="global-close-settings-btn"><i data-lucide="x"></i></button>
		<div class="settings-modal-content" id="settings-modal-content">

			<div class="help-tab-container">
				<button class="help-tab-btn active" data-tab="help-csv">
					<i data-lucide="folder-plus" style="width: 18px; height: 18px;"></i>フォルダ生成
				</button>
				<button class="help-tab-btn" data-tab="help-preview">
					<i data-lucide="monitor-play" style="width: 18px; height: 18px;"></i>データプレビュー
				</button>
			</div>

			<div class="help-tab-body">
				<!-- フォルダ生成 (CSV) タブ -->
				<div id="help-csv" class="help-tab-content active">
					<div class="tw-form-section">
						<div class="tw-section-header">
							<h3 id="section-title-folder" class="tw-section-title">フォルダ設定</h3>
						</div>
						<div class="tw-grid">
							<div class="tw-field tw-flex-between">
								<div>
									<label id="label-folder-number" class="tw-label"
										style="margin-bottom:0;">フォルダ名に連番を付ける</label>
									<div id="hint-folder-number" class="tw-hint">出力するフォルダ名に (001, 002...) を付与します</div>
								</div>
								<label class="toggle-switch">
									<input type="checkbox" id="setting-folder-number" checked>
									<span class="toggle-slider"></span>
								</label>
							</div>
						</div>
					</div>

					<div class="tw-form-section">
						<div class="tw-section-header">
							<h3 id="section-title-readme-csv" class="tw-section-title">READMEスタイル設定</h3>
						</div>
						<div class="tw-grid">
							<div class="tw-field">
								<label id="label-readme-heading" class="tw-label">見出しスタイル
									<div id="hint-readme-heading" class="tw-hint">見出しの装飾を変更できます</div>
								</label>
								<select class="tw-select" id="setting-readme-heading">
									<option value="bracket" selected>【見出し】</option>
									<option value="hash"># 見出し</option>
									<option value="line">―― 見出し ――</option>
									<option value="none">スタイルなし</option>
								</select>
							</div>
							<div class="tw-field tw-flex-between">
								<div>
									<label id="label-url-domain" class="tw-label"
										style="margin-bottom:0;">URLの伏せ字にドメインを付与する</label>
									<div id="hint-url-domain" class="tw-hint">
										リンク先がわかりやすくなります（例：URL-01＿_sample-com）<br>この設定は、出力するtxtファイルにも反映されます
									</div>
								</div>
								<label class="toggle-switch">
									<input type="checkbox" id="setting-url-domain" checked>
									<span class="toggle-slider"></span>
								</label>
							</div>
						</div>
					</div>
				</div>

				<!-- データプレビュー タブ -->
				<div id="help-preview" class="help-tab-content">

					<!-- README Settings -->
					<div class="tw-form-section">
						<div class="tw-section-header">
							<h3 id="section-title-readme-preview" class="tw-section-title">README表示設定</h3>
						</div>

						<div class="tw-grid">
							<!-- Toggle -->
							<div class="tw-field tw-flex-between">
								<div>
									<label id="label-readme-auto" class="tw-label"
										style="margin-bottom:0;">README.txtのプレビューサイズを固定する</label>
									<div id="hint-readme-auto" class="tw-hint">
										ONにすると、README.txtのみ設定したプレビューサイズに固定できます<br>
										発表前のキャプチャーサイズと、発表中のキャプチャーサイズが異なる場合などにオススメです</div>
								</div>
								<label class="toggle-switch">
									<input type="checkbox" id="setting-readme-auto" checked>
									<span class="toggle-slider"></span>
								</label>
							</div>

							<!-- Size -->
							<div class="tw-grid tw-sm-grid-cols-2">
								<div class="tw-field">
									<label id="label-readme-width" class="tw-label">プレビュー幅 (W)</label>
									<input type="number" class="tw-input" id="setting-readme-width" value="1024">
								</div>
								<div class="tw-field">
									<label id="label-readme-height" class="tw-label">プレビュー高さ (H)</label>
									<input type="number" class="tw-input" id="setting-readme-height" value="768">
								</div>
							</div>

							<!-- Font & Color -->
							<div class="tw-grid tw-sm-grid-cols-1">
								<div class="tw-field">
									<label id="label-readme-font-size" class="tw-label">フォントサイズ (px)</label>
									<input type="number" class="tw-input" id="setting-readme-font-size" value="20"
										min="10" max="100">
								</div>
								<div class="tw-field">
									<label id="label-readme-bg" class="tw-label">README.txtの背景色</label>
									<input type="color" class="tw-input-color" id="setting-readme-bg" value="#fdfbf7">
								</div>
							</div>

							<div class="tw-field">
								<label id="label-readme-font" class="tw-label">README.txtのフォント</label>
								<select class="tw-select" id="setting-readme-font">
									<option value="'Sawarabi Gothic', sans-serif" selected>ゴシック (Sawarabi Gothic)
									</option>
									<option value="'Zen Maru Gothic', sans-serif">丸ゴシック (Zen Maru Gothic)</option>
									<option value="'Noto Serif JP', serif">明朝体 (Noto Serif JP)</option>
									<option value="'Yomogi', cursive">筆記体 (Yomogi)</option>
									<option value='"Segoe UI", "Meiryo", sans-serif'>標準フォント</option>
								</select>
							</div>

							<div style="margin-top: 0.25rem;">
								<button type="button" class="tw-btn tw-btn-danger" id="reset-readme-btn">
									<i data-lucide="rotate-ccw" style="width: 14px; height: 14px;"></i>
									初期状態に戻す
								</button>
							</div>
						</div>
					</div>

					<!-- Alarm Settings -->
					<div class="tw-form-section">
						<div class="tw-section-header">
							<h3 id="section-title-alarm" class="tw-section-title">アラーム設定</h3>
							<p id="section-desc-alarm" class="tw-section-desc">指定した時間が経過した際に、アラーム音が鳴ります。</p>
						</div>

						<div class="tw-grid">
							<div class="tw-grid tw-sm-grid-cols-1">
								<div class="tw-field">
									<label id="label-alarm-time" class="tw-label">アラーム時間 (分)<div id="hint-alarm-time"
											class="tw-hint">0でアラームオフ</div></label>
									<input type="number" class="tw-input" id="setting-alarm-time" value="0" min="0">
								</div>
								<div class="tw-field">
									<label id="label-alarm-sound" class="tw-label">アラーム音</label>
									<select class="tw-select" id="setting-alarm-sound">
										<option value="se/call_niwatori.mp3" selected>ニワトリ</option>
										<option value="se/call_ahiru.mp3">アヒル</option>
										<option value="se/call_cuckoo.mp3">カッコウ</option>
										<option value="se/call_kizibato.mp3">キジバト</option>
										<option value="se/call_ohruri.mp3">オオルリ</option>
										<option value="se/call_kekkahappyo.mp3">ケッカハッピョー</option>
									</select>
								</div>
								<div class="tw-field" id="field-alarm-vol"
									style="justify-content: center; padding-top: 6px;">
									<label id="label-alarm-vol" class="tw-label"
										style="display: flex; justify-content: space-between;">
										音量 <span id="alarm-vol-display"
											style="color:#6b7280; font-weight:normal;">50%</span>
									</label>
									<input type="range" class="tw-range" id="setting-alarm-vol" min="0" max="1"
										step="0.05" value="0.5">
									<div style="margin-top: 0.25rem;">
										<button type="button" class="tw-btn" id="test-alarm-btn">
											<i data-lucide="play" style="width: 14px; height: 14px;"></i>
											テスト再生
										</button>
									</div>
								</div>
								<div class="tw-field tw-hint">音源：カシヲ
									<a href="https://youtu.be/j1qdBO51ka8?si=JYZqRQsFKdoPb521" target="_blank"
										style="color:#6b7280;">声マネキング</a> /
									<a href="https://youtu.be/YcfXozFdLz4?si=S_DlXrkhWiZXk4Eu&t=2019" target="_blank"
										style="color:#6b7280;">MyVoiceZoo</a>
								</div>
							</div>
						</div>
					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- 分割したJSを読み込み -->
	<script src="js/index.js"></script>

</body>

</html>
