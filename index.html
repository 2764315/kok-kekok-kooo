<!DOCTYPE html>
<html lang="ja">

<head>
	<meta name="robots" content="noindex">
	<meta charset="UTF-8">
	<title>発表配信ツール ｺｯｹｺｯｺ-!!!</title>
	<script src="https://unpkg.com/lucide@latest"></script>
	<link href="https://fonts.googleapis.com/css2?family=Sawarabi+Gothic&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			font-family: "Segoe UI", "Meiryo", sans-serif;
			margin: 0;
			height: 100vh;
			background-color: #f9fdfc;
			color: #333333;
			overflow: hidden;
		}

		.lucide {
			vertical-align: middle;
			width: 20px;
			height: 20px;
			stroke-width: 2;
		}

		/* === アクティビティバー === */
		#activity-bar {
			width: 60px;
			background-color: #A7E0CF;
			border-right: 1px solid #8ecbb9;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding-top: 15px;
			z-index: 20;
			flex-shrink: 0;
		}

		.activity-icon {
			width: 50px;
			height: 50px;
			border-radius: 8px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			color: #444;
			cursor: pointer;
			transition: all 0.2s;
			border: none;
			background: transparent;
			padding: 0;
			text-decoration: none;
		}

		.activity-icon:hover {
			background-color: rgba(255, 255, 255, 0.4);
			color: #333;
		}

		.activity-icon.active {
			background-color: #ffffff;
			color: #007b5e;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
		}

		.activity-icon span {
			font-size: 10px;
			margin-top: 4px;
			font-weight: bold;
		}

		/* === メインエリア (iframeコンテナ) === */
		#content-area {
			flex: 1;
			position: relative;
			background-color: #f9fdfc;
		}

		iframe {
			width: 100%;
			height: 100%;
			border: none;
			position: absolute;
			top: 0;
			left: 0;
		}

		.help-tab-container {
			display: flex;
			border-bottom: 1px solid #ddd;
			background-color: #f9f9f9;
			border-radius: 12px 12px 0 0;
		}

		.help-tab-btn {
			flex: 1;
			padding: 15px;
			border: none;
			background: none;
			font-size: 15px;
			font-weight: bold;
			color: #666;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			transition: background-color 0.2s, color 0.2s, border-bottom-color 0.2s;
		}

		.help-tab-btn.active {
			color: #007b5e;
			border-bottom-color: #007b5e;
		}

		.help-tab-btn:hover:not(.active) {
			background-color: #eee;
		}

		.help-tab-body {
			padding: 30px;
			overflow-y: auto;
		}

		.help-tab-content {
			display: none;
		}

		.help-tab-content.active {
			display: block;
		}

		.help-tab-content h2 {
			margin-top: 0;
			color: #007b5e;
			border-bottom: 2px solid #A7E0CF;
			padding-bottom: 10px;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.help-tab-content h4 {
			color: #333;
			margin-bottom: 5px;
			margin-top: 15px;
		}

		.help-tab-content p {
			margin-top: 0;
			font-size: 14px;
			color: #555;
			line-height: 1.6;
		}

		/* === 共通設定モーダル === */
		#global-settings-modal-overlay {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
			display: flex;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
			z-index: 100;
			justify-content: center;
			align-items: center;
			transition: opacity 0.25s ease, visibility 0s linear 0.25s;
		}

		#global-settings-modal-overlay.show {
			opacity: 1;
			visibility: visible;
			pointer-events: auto;
			transition: opacity 0.25s ease, visibility 0s linear 0s;
		}

		#global-settings-modal-overlay .settings-modal-content {
			background-color: #fff;
			border-radius: 12px;
			width: 600px;
			max-width: 90%;
			height: 90vh;
			max-height: 90vh;
			overflow-y: auto;
			position: relative;
			box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
			opacity: 0;
			visibility: hidden;
			transform: translateY(16px) scale(0.98);
			transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
		}

		#global-settings-modal-overlay.show .settings-modal-content {
			opacity: 1;
			visibility: visible;
			transform: translateY(0) scale(1);
			transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0s;
		}

		#global-settings-modal-overlay #global-close-settings-btn {
			position: absolute;
			top: 20px;
			right: 20px;
			width: 36px;
			height: 36px;
			border-radius: 9999px;
			border: none;
			background: #111;
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
			z-index: 110;
		}

		#global-settings-modal-overlay #global-close-settings-btn:hover {
			background: #333;
		}
	</style>
</head>

<body>
	<!-- アクティビティバー -->
	<div id="activity-bar">
		<div style="display: flex; flex-direction: column; gap: 15px; width: 100%; align-items: center;">
			<button id="nav-csv-btn" class="activity-icon active" title="フォルダ生成">
				<i data-lucide="folder-plus"></i>
				<span>準備用</span>
			</button>
			<button id="nav-preview-btn" class="activity-icon" title="データプレビュー">
				<i data-lucide="monitor-play"></i>
				<span>配信用</span>
			</button>
		</div>
		<div style="margin-top: auto; margin-bottom: 15px; width: 100%; display: flex; justify-content: center;">
			<button id="global-settings-btn" class="activity-icon" title="初期設定">
				<i data-lucide="settings"></i>
				<span>設定</span>
			</button>
		</div>
	</div>

	<!-- iframeコンテナ -->
	<div id="content-area">
		<iframe id="frame-csv" src="csv-converter.html" style="display: block;"></iframe>
		<iframe id="frame-preview" src="preview-deck.html" style="display: none;"></iframe>
	</div>

	<!-- 共通設定モーダル -->
	<div id="global-settings-modal-overlay">
		<button id="global-close-settings-btn">×</button>
		<div class="settings-modal-content">

			<div class="help-tab-container">
				<button class="help-tab-btn active" data-tab="help-csv">
					<i data-lucide="folder-plus"></i>フォルダ生成
				</button>
				<button class="help-tab-btn" data-tab="help-preview">
					<i data-lucide="monitor-play"></i>データプレビュー
				</button>
			</div>
			<div class="help-tab-body">
				<div id="help-csv" class="help-tab-content active">

					<p style="margin-top: 15px;">
						ここに設定
					</p>
				</div>
				<div id="help-preview" class="help-tab-content">
					<p style="margin-top: 15px;">
						ここに設定
					</p>
				</div>
			</div>
		</div>
	</div>

	<script>
		// --- 画面切り替え制御 ---
		const navCsvBtn = document.getElementById('nav-csv-btn');
		const navPreviewBtn = document.getElementById('nav-preview-btn');
		const frameCsv = document.getElementById('frame-csv');
		const framePreview = document.getElementById('frame-preview');

		navCsvBtn.addEventListener('click', () => {
			navCsvBtn.classList.add('active');
			navPreviewBtn.classList.remove('active');
			frameCsv.style.display = 'block';
			framePreview.style.display = 'none';
		});

		navPreviewBtn.addEventListener('click', () => {
			navPreviewBtn.classList.add('active');
			navCsvBtn.classList.remove('active');
			frameCsv.style.display = 'none';
			framePreview.style.display = 'block';
		});

		// --- モーダル制御 ---
		const helpTabBtns = document.querySelectorAll('.help-tab-btn');
		const helpTabContents = document.querySelectorAll('.help-tab-content');

		helpTabBtns.forEach(btn => {
			btn.addEventListener('click', () => {
				helpTabBtns.forEach(b => b.classList.remove('active'));
				btn.classList.add('active');
				const targetId = btn.getAttribute('data-tab');
				helpTabContents.forEach(content => {
					if (content.id === targetId) content.classList.add('active');
					else content.classList.remove('active');
				});
			});
		});

		// --- 初期設定モーダル制御 ---
		const globalSettingsBtn = document.getElementById('global-settings-btn');
		const globalSettingsModalOverlay = document.getElementById('global-settings-modal-overlay');
		const globalCloseSettingsBtn = document.getElementById('global-close-settings-btn');

		globalSettingsBtn.addEventListener('click', () => { globalSettingsModalOverlay.classList.add('show'); });
		globalCloseSettingsBtn.addEventListener('click', () => { globalSettingsModalOverlay.classList.remove('show'); });
		globalSettingsModalOverlay.addEventListener('click', (e) => { if (e.target === globalSettingsModalOverlay) globalSettingsModalOverlay.classList.remove('show'); });

		lucide.createIcons();
	</script>
</body>

</html>
